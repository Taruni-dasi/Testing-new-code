<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Джапа Медитация</title>
<style>
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#1a0533;color:#fff;text-align:center}
.box{max-width:500px;margin:0 auto;background:rgba(255,255,255,0.1);padding:20px;border-radius:15px}
h1{color:#ffd700;margin-bottom:20px}
.image{width:100%;height:200px;background:#333;border-radius:10px;margin:15px 0;display:flex;align-items:center;justify-content:center;font-size:60px}
.timer{font-size:48px;color:#ffd700;margin:20px 0;font-family:monospace}
button{padding:15px 25px;margin:5px;font-size:16px;border:none;border-radius:8px;cursor:pointer;background:#ffd700;color:#000;font-weight:bold}
button.stop{background:#ff4444;color:#fff}
.status{margin-top:15px;color:#4ade80}
</style>
</head>
<body>
<div class="box">
<h1>🙏 Джапа Медитация</h1>
<div class="image" id="img">🙏</div>
<div id="title">Шрила Свами Прабхупада</div>
<div class="timer" id="timer">08:00</div>
<div>
<button onclick="prev()">◀ Прошлая</button>
<button id="btn" onclick="toggle()">▶ Начать</button>
<button onclick="next()">Следующая ▶</button>
</div>
<div class="status" id="status">Готов к медитации</div>
</div>

<script>
var data=[
{title:"Шрила Свами Прабхупада",icon:"🙏",bg:"#1a237e"},
{title:"Чайтанья Махапрабху и Нитьянанда",icon:"🙏🙏",bg:"#b71c1c"},
{title:"Радха и Кришна",icon:"🙏🙏",bg:"#1b5e20"}
];
var idx=0,playing=false,time=480,iv=null,actx=null;

function render(){
document.getElementById('img').textContent=data[idx].icon;
document.getElementById('img').style.background=data[idx].bg;
document.getElementById('title').textContent=data[idx].title;
}

function toggle(){playing?stop():start()}

function start(){
playing=true;time=480;
document.getElementById('btn').textContent='⏹ Стоп';
document.getElementById('btn').className='stop';
document.getElementById('status').textContent='🎵 Медитация идёт...';
playSound();
iv=setInterval(function(){
time--;
var m=Math.floor(time/60),s=time%60;
document.getElementById('timer').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
if(time<=0){stop();document.getElementById('status').textContent='✅ Завершено!'}
},1000);
}

function stop(){
playing=false;clearInterval(iv);
document.getElementById('btn').textContent='▶ Начать';
document.getElementById('btn').className='';
document.getElementById('timer').textContent='08:00';
document.getElementById('status').textContent='Готов к медитации';
if(actx){actx.close();actx=null}
}

function playSound(){
try{
actx=new(window.AudioContext||window.webkitAudioContext)();
var o=actx.createOscillator(),g=actx.createGain();
o.frequency.value=136.1;o.type='sine';
g.gain.value=0.15;
o.connect(g);g.connect(actx.destination);
o.start();
}catch(e){}
}

function next(){if(!playing){idx=(idx+1)%3;render()}}
function prev(){if(!playing){idx=(idx+2)%3;render()}}

render();
</script>
</body>
</html>
