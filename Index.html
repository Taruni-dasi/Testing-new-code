<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Праздничный Тест</title>
    <!-- Исправленная и полная ссылка на Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
        }
        .quiz-card { 
            width: 100%; 
            max-width: 550px; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.06); 
        }
        .btn-answer { 
            display: block; 
            width: 100%; 
            text-align: left; 
            margin-bottom: 12px; 
            padding: 14px 20px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0; 
            background: #fff; 
            transition: all 0.2s; 
            color: #2d3748; 
            font-weight: 500; 
            font-size: 1rem; 
            cursor: pointer;
        }
        .btn-answer:hover:not(:disabled) { 
            background: #edf2f7; 
            border-color: #cbd5e1; 
        }
        .btn-answer:disabled {
            cursor: default;
            opacity: 0.9;
        }
        .correct { 
            background-color: #c6f6d5 !important; 
            border-color: #38a169 !important; 
            color: #22543d !important; 
            font-weight: bold; 
        }
        .incorrect { 
            background-color: #fed7d7 !important; 
            border-color: #e53e3e !important; 
            color: #742a2a !important; 
        }
        .progress-container { 
            background-color: #e2e8f0; 
            height: 10px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            width: 100%; 
            overflow: hidden; 
        }
        .progress-bar-fill { 
            background-color: #6b46c1; 
            height: 100%; 
            width: 0%; 
            transition: width 0.3s ease; 
        }
        .q-text { 
            font-size: 1.25rem; 
            color: #1a202c; 
            font-weight: 600; 
            margin-bottom: 25px; 
            line-height: 1.4; 
        }
        .badge-step { 
            background-color: #f1f5f9; 
            color: #64748b; 
            font-size: 0.85rem; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            display: inline-block; 
            margin-bottom: 15px; 
        }
        .btn-next, .btn-restart { 
            display: none; 
            width: 100%; 
            background-color: #6b46c1; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            margin-top: 15px; 
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .btn-next:hover, .btn-restart:hover { 
            background-color: #553c9a; 
        }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div class="d-flex justify-content-between align-items-center">
            <span id="quiz-step-badge" class="badge-step">Загрузка...</span>
        </div>
        <div class="progress-container">
            <div id="quiz-progress-fill" class="progress-bar-fill"></div>
        </div>

        <h3 id="quiz-title" class="text-center text-muted mb-4 fs-6 fw-normal"></h3>

        <div id="quiz-screen">
            <div id="question-text" class="q-text"></div>
            <div id="answers-block"></div>
            <button id="btn-next-step" class="btn-next">Дальше →</button>
        </div>

        <div id="result-screen" style="display: none;" class="text-center py-4">
            <h2 class="mb-3" style="color: #6b46c1;">✨ Тест завершен! ✨</h2>
            <p class="fs-5 text-secondary mb-4">Спасибо за участие и памятование!</p>
            <div id="final-score" class="alert d-inline-block px-5 py-3 fw-bold fs-3" style="border-radius: 16px; background-color: #eef2ff; color: #4338ca; border: none;"></div>
            <br>
            <button id="btn-restart" class="btn-restart">Начать заново ↺</button>
        </div>
    </div>

    <!-- ДАННЫЕ ТЕСТА В ФОРМАТЕ JSON -->
    <script id="quiz-data" type="application/json">

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            try {
                const rawData = document.getElementById('quiz-data').textContent.trim();
                const quiz = JSON.parse(rawData);
                
                const titleEl = document.getElementById('quiz-title');
                const badgeEl = document.getElementById('quiz-step-badge');
                const progressFillEl = document.getElementById('quiz-progress-fill');
                const questionTextEl = document.getElementById('question-text');
                const answersBlockEl = document.getElementById('answers-block');
                const quizScreenEl = document.getElementById('quiz-screen');
                const resultScreenEl = document.getElementById('result-screen');
                const finalScoreEl = document.getElementById('final-score');
                const nextBtn = document.getElementById('btn-next-step');
                const restartBtn = document.getElementById('btn-restart');

                titleEl.innerText = quiz.title || "Праздничный Тест";
                
                let currentIdx = 0;
                let score = 0;
                let currentQuestions = [];

                // Функция для случайного перемешивания массива (алгоритм Фишера-Йетса)
                function shuffleArray(array) {
                    const shuffled = [...array];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    return shuffled;
                }

                // Инициализация или перезапуск теста
                function initQuiz() {
                    currentIdx = 0;
                    score = 0;
                    // Перемешиваем вопросы при каждом запуске
                    currentQuestions = shuffleArray(quiz.questions);
                    
                    // Сброс видимости экранов
                    quizScreenEl.style.display = "block";
                    badgeEl.style.display = "inline-block";
                    progressFillEl.parentElement.style.display = "block";
                    titleEl.style.display = "block";
                    resultScreenEl.style.display = "none";
                    nextBtn.style.display = "none";
                    
                    renderQuestion();
                }

                function renderQuestion() {
                    if (currentIdx >= currentQuestions.length) {
                        // Показываем экран результатов
                        quizScreenEl.style.display = "none";
                        badgeEl.style.display = "none";
                        progressFillEl.parentElement.style.display = "none";
                        titleEl.style.display = "none";
                        
                        finalScoreEl.innerHTML = `Ваш результат:<br>${score} из ${currentQuestions.length}`;
                        resultScreenEl.style.display = "block";
                        restartBtn.style.display = "block"; // Показываем кнопку перезапуска
                        return;
                    }

                    nextBtn.style.display = "none";
                    badgeEl.innerText = `Вопрос ${currentIdx + 1} из ${currentQuestions.length}`;
                    
                    const progressPercent = (currentIdx / currentQuestions.length) * 100;
                    progressFillEl.style.width = progressPercent + "%";

                    const currentQuestion = currentQuestions[currentIdx];
                    questionTextEl.innerText = currentQuestion.question;
                    answersBlockEl.innerHTML = ""; 

                    // Поддержка как answers, так и choices для обратной совместимости
                    const answersList = currentQuestion.answers || currentQuestion.choices;
                    const correctVal = parseInt(currentQuestion.answer);

                    answersList.forEach((ans, aIdx) => {
                        const btn = document.createElement('button');
                        btn.className = "btn-answer";
                        btn.innerText = ans;
                        
                        btn.onclick = function() {
                            // Блокируем все кнопки после выбора
                            answersBlockEl.querySelectorAll('.btn-answer').forEach(b => b.disabled = true);
                            
                            // Сравниваем индекс нажатой кнопки с правильным ответом
                            if (aIdx === correctVal) {
                                btn.classList.add('correct');
                                score++;
                            } else {
                                btn.classList.add('incorrect');
                                // Подсвечиваем верный ответ зеленым, если выбран неверный
                                const allButtons = answersBlockEl.querySelectorAll('.btn-answer');
                                if (allButtons[correctVal]) {
                                    allButtons[correctVal].classList.add('correct');
                                }
                            }
                            // Показываем кнопку "Дальше"
                            nextBtn.style.display = "block";
                        };
                        answersBlockEl.appendChild(btn);
                    });
                }

                // Обработчики событий
                nextBtn.onclick = function() {
                    currentIdx++;
                    renderQuestion();
                };

                restartBtn.onclick = function() {
                    initQuiz();
                };

                // Запуск теста при загрузке
                initQuiz();

            } catch (e) {
                document.getElementById('quiz-screen').innerHTML = "<p style='color:red; text-align:center;'>Ошибка чтения данных теста. Проверьте корректность JSON в теге &lt;script id='quiz-data'&gt;.</p>";
                console.error("Ошибка парсинга JSON:", e);
            }
        });
    </script>
</body>
</html>
