<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джапа-медитация</title>
    <style>
        /* === СТИЛИ (CSS) === */
        :root {
            --primary-color: #ff9933; /* Шафрановый цвет */
            --primary-hover: #e68a00;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4e4c1 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            margin-top: 0;
        }

        /* Секции */
        .section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Аудио плеер */
        .audio-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
        }

        .buttons-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.95);
        }

        button.secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background-color: #d0d0d0;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 250px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* Слайдер изображений */
        .slider-container {
            position: relative;
            margin: 10px 0;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background-color: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.85);
            color: var(--primary-color);
            border: 1px solid rgba(0,0,0,0.05);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.1s;
            padding: 0;
        }

        .slider-btn:hover {
            background-color: white;
            transform: translateY(-50%) scale(1.05);
        }

        .slider-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .prev-btn { left: 12px; }
        .next-btn { right: 12px; }

        .description {
            margin-top: 20px;
            padding: 15px 20px;
            background-color: #f9f9f9;
            border-radius: 12px;
            text-align: left;
            border-left: 4px solid var(--primary-color);
        }

        .desc-ru {
            font-size: 16px;
            color: var(--text-color);
            margin-bottom: 8px;
            line-height: 1.5;
            font-weight: 500;
        }

        .desc-en {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
            min-height: 20px; /* Чтобы блок не прыгал, когда текст пустой */
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🕉 Джапа-медитация</h1>

    <!-- 1. Слайдер изображений (теперь идет первым) -->
    <div class="section">
        <label>Образ для медитации и молитвы</label>
        <div class="slider-container">
            <div class="image-wrapper">
                <button class="slider-btn prev-btn" id="prevBtn" aria-label="Предыдущее изображение">❮</button>
                <img src="https://raw.githubusercontent.com/Taruni-dasi/Testing-new-code/main/assets/images/01%20Rupa%20Sanatana%20Math%20Vrinda.jpg" alt="Meditation Image" class="slide-image" id="slideImage" style="opacity: 1;">
                <button class="slider-btn next-btn" id="nextBtn" aria-label="Следующее изображение">❯</button>
            </div>
        </div>
        <div class="description">
            <div class="desc-ru" id="descRu">Божество Вринда Деви в Шри Рупа-Санатана Матхе во Вриндаване.</div>
            <div class="desc-en" id="descEn"> </div>
        </div>
    </div>

    <!-- 2. Выбор мантры и Аудио плеер (теперь идет вторым) -->
    <div class="section">
        <label for="mantraSelect">Выберите мантру для повторения:</label>
        <select id="mantraSelect">
            <option value="">-- Нажмите для выбора --</option>
            <!-- Опции будут добавлены через JavaScript -->
        <option value="audio/01_Srila-Gurudev-japa108-flute.mp3">Шрила Гурудев (с флейтой)</option><option value="audio/01_Srila-Gurudev-japa108.mp3">Шрила Гурудев</option><option value="audio/02-Srila-Prabhupada-japa108.mp3">Шрила Прабхупада</option><option value="audio/03_Prabhuji-japa108-quiet.mp3">Прабхуджи (тихий)</option></select>
        <div class="status-text" id="statusText">Мантра не выбрана</div>

        <div class="audio-controls">
            <div class="buttons-row">
                <button id="playPauseBtn" disabled="">▶ Играть</button>
                <button id="stopBtn" class="secondary" disabled="">⏹ Стоп</button>
            </div>
            <div class="volume-control">
                <span>🔈</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" disabled="">
                <span>🔊</span>
            </div>
        </div>
        
        <!-- Скрытый аудио элемент -->
        <audio id="audioPlayer"></audio>
    </div>
</div>

<script>
    /* === ЛОГИКА (JavaScript) === */
    
    // Базовый URL для ваших файлов на GitHub (raw формат для прямого доступа)
    const BASE_URL = "https://raw.githubusercontent.com/Taruni-dasi/Testing-new-code/main/assets/";

    // 1. Данные мантр (аудиофайлы)
    const mantras = [
        { name: "Шрила Гурудев (с флейтой)", file: "audio/01_Srila-Gurudev-japa108-flute.mp3" },
        { name: "Шрила Гурудев", file: "audio/01_Srila-Gurudev-japa108.mp3" },
        { name: "Шрила Прабхупада", file: "audio/02-Srila-Prabhupada-japa108.mp3" },
        { name: "Прабхуджи (тихий)", file: "audio/03_Prabhuji-japa108-quiet.mp3" }
    ];

    // 2. Данные слайдов (изображения и описания)
    const slides = [
        { 
            image: "images/01 Gurudev smiling.jpg", 
            descRu: "Шрила Гурудев улыбается, даря благословения преданным.", 
            descEn: "" 
        },
        { 
            image: "images/01 Gurudev.jpg", 
            descRu: "Шрила Гурудев в медитации и молитве.", 
            descEn: "" 
        },
        { 
            image: "images/01 Rupa Sanatana Math Vrinda.jpg", 
            descRu: "Божество Вринда Деви в Шри Рупа-Санатана Матхе во Вриндаване.", 
            descEn: "" 
        },
        {
            image: "images/04 Swami Prabhupada Deities.png",
            descRu: "Божества Шрила Прабхупады.",
            descEn: ""
        },
        {
            image: "images/05 Bhakti_Pragyana_Keshava_murti_Radhe_Kunj.jpg",
            descRu: "Бхакти Прагьяна Кешава Махарадж (мурти) в Радхе Кунде.",
            descEn: ""
        }
    ];

    // Переменные состояния
    let currentSlideIndex = 0;

    // Элементы DOM
    const mantraSelect = document.getElementById('mantraSelect');
    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const statusText = document.getElementById('statusText');
    
    const slideImage = document.getElementById('slideImage');
    const descRu = document.getElementById('descRu');
    const descEn = document.getElementById('descEn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // === Инициализация ===
    function init() {
        // Заполняем выпадающий список мантр
        mantras.forEach((mantra) => {
            const option = document.createElement('option');
            option.value = mantra.file; // Теперь храним путь к файлу как значение
            option.textContent = mantra.name;
            mantraSelect.appendChild(option);
        });

        // Загружаем первый слайд
        updateSlide();
    }

    // === Логика аудио ===
    mantraSelect.addEventListener('change', function() {
        const selectedFile = this.value;
        if (selectedFile === "") {
            statusText.textContent = "Мантра не выбрана";
            playPauseBtn.disabled = true;
            stopBtn.disabled = true;
            volumeSlider.disabled = true;
            audioPlayer.src = "";
            return;
        }

        const audioUrl = BASE_URL + encodeURI(selectedFile);
        audioPlayer.src = audioUrl;
        audioPlayer.load();
        
        // Находим имя выбранной мантры для статуса
        const selectedOption = this.options[this.selectedIndex];
        statusText.textContent = `Готово к воспроизведению: ${selectedOption.textContent}`;
        
        playPauseBtn.disabled = false;
        stopBtn.disabled = false;
        volumeSlider.disabled = false;
        
        playPauseBtn.innerHTML = "▶ Играть";
    });

    playPauseBtn.addEventListener('click', function() {
        if (audioPlayer.paused) {
            audioPlayer.play().then(() => {
                playPauseBtn.innerHTML = "⏸ Пауза";
                statusText.textContent = "Воспроизведение...";
            }).catch(error => {
                console.error("Ошибка воспроизведения:", error);
                statusText.textContent = "Ошибка воспроизведения. Попробуйте еще раз.";
            });
        } else {
            audioPlayer.pause();
            playPauseBtn.innerHTML = "▶ Играть";
            statusText.textContent = "На паузе";
        }
    });

    stopBtn.addEventListener('click', function() {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        playPauseBtn.innerHTML = "▶ Играть";
        statusText.textContent = "Остановлено";
    });

    volumeSlider.addEventListener('input', function() {
        audioPlayer.volume = this.value;
    });

    // Сброс кнопки по окончании трека
    audioPlayer.addEventListener('ended', function() {
        playPauseBtn.innerHTML = "▶ Играть";
        statusText.textContent = "Воспроизведение завершено";
    });

    // === Логика слайдера ===
    function updateSlide() {
        const slide = slides[currentSlideIndex];
        slideImage.src = BASE_URL + encodeURI(slide.image);
        descRu.textContent = slide.descRu;
        descEn.textContent = slide.descEn || " "; 
        
        // Плавное появление
        slideImage.style.opacity = 0;
        setTimeout(() => {
            slideImage.style.opacity = 1;
        }, 50);
    }

    prevBtn.addEventListener('click', function() {
        currentSlideIndex = (currentSlideIndex === 0) ? slides.length - 1 : currentSlideIndex - 1;
        updateSlide();
    });

    nextBtn.addEventListener('click', function() {
        currentSlideIndex = (currentSlideIndex === slides.length - 1) ? 0 : currentSlideIndex + 1;
        updateSlide();
    });

    // Запуск
    init();
</script>


</body></html>
